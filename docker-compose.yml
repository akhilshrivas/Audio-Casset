version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deshiwave-backend
    ports:
      - "8000:8000"
    environment:
      - DATA_LAKE_ROOT=/app/data_lake
      - PORT=8000
    volumes:
      - ./data_lake:/app/data_lake
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deshiwave-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
